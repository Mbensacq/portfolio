<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b95ff"/>
      <stop offset="1" stop-color="#2dd4ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="20%" r="55%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="30%" r="50%">
      <stop offset="0" stop-color="#2dd4ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0e14"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- monogramme -->
  <rect x="80" y="96" width="96" height="96" rx="24" fill="url(#g)"/>
  <text x="128" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#0a0e14">MB</text>

  <!-- statut -->
  <g transform="translate(80, 250)">
    <rect x="0" y="0" width="270" height="44" rx="22" fill="#111824" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="26" cy="22" r="6" fill="#34d399"/>
    <text x="46" y="29" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a3b2c6">Disponible immédiatement</text>
  </g>

  <!-- nom -->
  <text x="78" y="380" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" fill="#e8eef7">Mathis Bensacq</text>

  <!-- rôle -->
  <text x="80" y="452" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="url(#g)">Développeur Full Stack JavaScript</text>

  <!-- stack -->
  <text x="80" y="506" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#a3b2c6">React · Node.js · TypeScript</text>
</svg>
